<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Newsletter Calendar</title><link rel="stylesheet" href="/static/style.css"></head><body><div class="shell"><aside><div class="brand">● <b>Newsletter</b><small>Calendar</small></div>{% if user %}<nav><a href="/">Календарь</a><a href="/history">История</a>{% if user.role=="admin" %}<a href="/teams">Команды</a>{% endif %}</nav><div class="who"><b>{{user.name}}</b><small>{{user.email}}</small><a href="/logout">Выйти</a></div>{% endif %}</aside><main>{% for c,m in get_flashed_messages(with_categories=true) %}<div class="flash {{c}}">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></div></body></html>
